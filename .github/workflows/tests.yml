name: Backend tests

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Smoke-test API import and routes
        run: python -c "from app.main import app; assert '/api/generate/pattern' in app.openapi()['paths']; print(app.title)"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
